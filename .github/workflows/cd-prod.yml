name: CD - Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Step 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 3 - Deploy Hook Trigger via Curl
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_PROD_URL }}

      - name: Step 4 - Confirm Deployment
        run: echo "Deployment to production environment triggered at $(date)"