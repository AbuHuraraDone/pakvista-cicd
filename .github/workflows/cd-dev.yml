name: CD - Development

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Step 1 - Checkout Code
        uses: actions/checkout@v4

      - name: Step 3 - Deploy Hook Trigger via Curl
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEV_URL }}

      - name: Step 4 - Confirm Deployment
        run: echo "Deployment to development environment triggered at $(date)"